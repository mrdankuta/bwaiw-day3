[package]
name = "budget-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM binding for the canonical budget engine: month-inputs JSON in, Plan JSON out"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
budget-engine = { path = "../budget-engine" }
wasm-bindgen = "0.2"
serde_json = "1"
